<script>
var KEY="app-v2",S=null;
function uid(){return Math.random().toString(36).slice(2,9)}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}

}

S.bud=S.bud||{};S.rec=S.rec||[];S.jam=S.jam||[];S.acc=S.acc||[];S.wish=S.wish||[];S.debt=S.debt||[];S.exin=S.exin||{};S.cats=S.cats||[];S.wk=S.wk||{on:false,amt:0};S.ch=S.ch||{on:false,base:10,start:'',done:[]};S.tpl=S.tpl||[];S.ru=S.ru||{on:false,step:5,goal:''};S.sd=S.sd||{};S.lock=S.lock||{};S.hc=S.hc||{};S.ev=S.ev||[];S.fx=S.fx||[];
var CATS=[["أكل","🍽️"],["مواصلات","🚌"],["فواتير","🧾"],["ترفيه","🎮"],["صحة","💊"],["تسوق","🛍️"],["جمعية","🤝"],["ديون","💸"],["أخرى","📦"]];
S.cats.forEach(function(c){CATS.push(c)});var ICONS=["🎯","🏍️","📱","💻","🚗","🏠","✈️","💍","🎓","🎁"];
var MN=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function ds(d){d=d||new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
var today=ds(),cur=today.slice(0,7),vm=cur,page="home",modal=false,eg=-1,fc="",ee="",ei=-1,dg="",lg="",q="",qf=false,oc="",o6=false,edb="";

function h(t,p){
  var e=document.createElement(t);p=p||{};
  for(var a in p){if(a=="class")e.className=p[a];else if(a=="value")e.value=p[a];else if(a.slice(0,2)=="on")e[a]=p[a];else e.setAttribute(a,p[a])}

  return e;
}
function applyRec(){var ch=false;S.rec.forEach(function(r){var m=shift(r.last,1);while(m<=cur){var dt=m+'-'+('0'+Math.min(r.day,28)).slice(-2);if(dt<=today){S.exp.push({id:uid(),amt:r.amt,cat:r.cat,note:r.name+' (ثابت)',date:dt});r.last=m;m=shift(m,1);ch=true}else break}});if(ch)save()}
function stat(l,v,c){return h("div",{class:"st "+(c||"")},h("span",{},l),h("b",{},f(v)))}
function mnav(){return h("div",{class:"mnav"},
  h("button",{class:"ic",onclick:function(){vm=shift(vm,-1);render()}},"›"),
  h("b",{},mname(vm)),
  h("button",{class:"ic",onclick:function(){vm=shift(vm,1);render()}},"‹"))}
function applyTheme(){var r=document.documentElement;if(S.pal)r.setAttribute('data-pal',S.pal);else r.removeAttribute('data-pal');if(S.theme=="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",S.theme)}

function home(){
  var inc=mInc(vm),ex=mExp(vm),rem=inc-ex,out=[mnav()];
  var lim=ds(new Date(Date.now()+2*864e5));

  if(vm==cur&&S.exp.length){var ld=S.exp.reduce(function(m,e){return e.date>m?e.date:m},'');var gap=Math.round((new Date(today)-new Date(ld))/864e5);if(gap>=3)out.push(h('div',{class:'card note',style:'color:var(--neg)'},'🔔 من '+gap+' أيام مسجلتش أي مصروف، فاكر تسجّل؟'))}
  out.push(h("div",{class:"grid3"},stat("دخل الشهر",inc,"pos"),stat("مصروفات الشهر",ex,"neg"),stat("المتبقي",rem,rem<0?"neg":"")));
  if(vm==cur){

    out.push(h("div",{class:"card hero"},h("span",{},"الحد اليومي المسموح"),h("b",{class:"big"},f(al)),
      h("span",{},inc>0?(lt>=0?"فاضل لك النهاردة "+f(lt):"عدّيت الحد النهاردة بـ "+f(-lt)):"سجّل دخل الشهر عشان يتحسب الحد"),
      h("small",{},"محسوب على "+left+" يوم باقي في الشهر")));
  }
  var gs=sum(S.goals,'saved'),ai=Object.keys(S.inc).reduce(function(s,k){return s+sum(S.inc[k],'amt')},0),ae=sum(S.exp,'amt'),hasAcc=S.acc.length>0,tot=hasAcc?sum(S.acc,'bal'):ai-ae,fr=tot-gs;
  out.push(h('div',{class:'card'},h('h3',{},'فلوسي'),h('div',{class:'grid3',style:'margin:0'},stat('الإجمالي',tot,tot<0?'neg':''),stat('في الأهداف',gs,'pos'),stat('مش متضاف لهدف',fr,fr<0?'neg':'pos')),h('div',{class:'note',style:'margin:8px 0 0'},(hasAcc?'الإجمالي = مجموع أرصدة حساباتك':'الإجمالي = كل دخلك ناقص كل مصروفاتك')+(fr<0?' · ⚠️ الأهداف أكتر من إجمالي فلوسك':''))));
  out.push(h('div',{class:'grid2'},stat('إجمالي الدخل',ai,'pos'),stat('إجمالي المصروفات',ae,'neg')));
  var op=S.goals.filter(function(g){return g.saved<g.target}).sort(function(a,b){return b.saved/b.target-a.saved/a.target})[0];
  if(op){var p=Math.round(op.saved/op.target*100);
    out.push(h("div",{class:"card"},h("h3",{},"أقرب هدف توصله"),h("b",{class:"gn"},op.icon+" "+op.name),
      h("div",{class:"bar"},h("div",{class:"fill",style:"width:"+p+"%"})),
